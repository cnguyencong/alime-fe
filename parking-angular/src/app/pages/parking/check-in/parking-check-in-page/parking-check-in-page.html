<div class="check-in-page">
  <header class="page-header">
    <div>
      <h1>Check-in Vehicle</h1>
      <p class="subtitle">Register vehicle into parking lot</p>
    </div>
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 5V19M5 12H19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </header>

  <div class="form-container">
    <form class="check-in-form">
      <div class="form-card">
        <div class="form-header">
          <h2>Vehicle Information</h2>
          <p class="form-description">Enter information to register vehicle into parking lot</p>
        </div>

        <div class="form-fields">
          <label class="field">
            <span class="field-label">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M9 17H15M9 13H15M9 9H10.01M5 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              License Plate
            </span>
            <input
              [(ngModel)]="licensePlate"
              name="licensePlate"
              placeholder="e.g: 43A-123.45"
              required
              class="form-input"
              [disabled]="isLoading"
            />
          </label>

          <label class="field">
            <span class="field-label">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M8 7H16M8 12H16M8 17H12M3 3H21C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Vehicle Type
            </span>
            <select
              [(ngModel)]="vehicleType"
              name="vehicleType"
              class="form-select"
              [disabled]="isLoading"
            >
              <option value="motorbike">Motorbike</option>
              <option value="car">Car</option>
            </select>
          </label>
        </div>

        <button type="button" class="btn-submit" [disabled]="isLoading" (click)="submit()">
          @if (isLoading) {
          <svg class="spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
              stroke-linecap="round"
              stroke-dasharray="32"
              stroke-dashoffset="32"
            >
              <animate
                attributeName="stroke-dasharray"
                dur="2s"
                values="0 32;16 16;0 32;0 32"
                repeatCount="indefinite"
              />
              <animate
                attributeName="stroke-dashoffset"
                dur="2s"
                values="0;-16;-32;-32"
                repeatCount="indefinite"
              />
            </circle>
          </svg>
          Processing... } @else {
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5 13L9 17L19 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Check-in }
        </button>
      </div>
    </form>

    @if (error) {
    <div class="alert alert-error">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 8V12M12 16H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>{{ error }}</span>
    </div>
    } @if (message) {
    <div class="alert alert-success">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>{{ message }}</span>
    </div>
    }
  </div>
</div>
